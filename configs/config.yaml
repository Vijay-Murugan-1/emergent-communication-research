defaults:
  - _self_
  - experiment: null

environment:
  name: "reconstruction"
  max_steps: 100

dataset:
  name: "mnist"
  path: "datasets/"
  batch_size: 64
  num_workers: 0
  pin_memory: False
  split: "train"

agent:
  encoder_type: "cnn"
  decoder_type: "cnn"
  hidden_dim: 256
  learning_rate: 0.0003

communication:
  protocol: "reinforce"
  vocab_size: 20
  max_length: 10
  temperature: 1.0
  noise_prob: 0.0

reward:
  alpha_reconstruction: 1.0
  beta_compression: 0.1
  gamma_diversity: 0.1
  delta_efficiency: 0.0
  penalties: 0.5

optimizer:
  name: "adamw"
  lr: 0.0003
  weight_decay: 0.0001

scheduler:
  name: "cosine"
  warmup_steps: 500

training:
  epochs: 2
  seed: 42
  device: "cuda"
  mixed_precision: True
  clip_grad_norm: 1.0

evaluation:
  eval_freq: 1000
  metrics: ["accuracy", "loss", "compression", "entropy"]

experiment:
  name: "rl_reconstruction"
  log_dir: "logs/"
  checkpoint_dir: "checkpoints/"
